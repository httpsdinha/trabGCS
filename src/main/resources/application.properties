spring.application.name=cookbook
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/cb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cb}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=${SERVER_PORT:8080}

# Habilitar CORS globalmente
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3001}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true