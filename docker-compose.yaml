#  CookBook Docker Compose Configuration
# 
# TROUBLESHOOTING COMUM:
# - Mac M1/M2 users: Se receber "exec format error", adicione "platform: linux/amd64" 
#   ao serviço db (não commitar essa alteração)
# - Windows: Certifique-se que o Docker Desktop está rodando
#
services:
  db:
    image: postgres:16
    container_name: cb_db
    environment:
      POSTGRES_USER: cb
      POSTGRES_PASSWORD: cb
      POSTGRES_DB: cb
    networks:
      - app-network
    ports:
      - "5432:5432"
  api:
    build:
      context: ./
    container_name: cb_api
    environment:
      DATABASE_HOST: cb_db
      DATABASE_PORT: 5432
      DATABASE_USER: cb
      DATABASE_PASSWORD: cb
      DATABASE_NAME: cb
    networks:
      - app-network
    ports:
      - "8080:8080"
    depends_on:
      - db

networks:
  app-network:
    driver: bridge